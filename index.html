<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Xác Nhận Chấm Công - An Việt Homes</title>
    
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- THƯ VIỆN AI OCR ĐỂ QUÉT CHỮ -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- THƯ VIỆN THÂM NHẬP METADATA ẢNH -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <style>
        body { 
            background-color: #dcf0fa; 
            font-family: 'Manrope', sans-serif; 
            color: #111; 
        }
        .top-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 40px; 
        }
        .company-info { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        .company-info img { 
            height: 50px; 
        }
        .company-name { 
            font-weight: 600; 
            font-size: 14px; 
            text-transform: uppercase; 
            color: #111; 
            line-height: 1.4; 
            max-width: 300px;
        }
        .btn-check-status { 
            background-color: #001a72; 
            color: #fff; 
            border-radius: 30px; 
            padding: 10px 25px; 
            font-weight: 600; 
            font-size: 14px; 
            border: none; 
            transition: 0.3s; 
        }
        .btn-check-status:hover { 
            background-color: #00104a; 
            color: #fff; 
        }

        .form-container { 
            background: #fff; 
            max-width: 800px; 
            margin: 20px auto 50px; 
            padding: 40px 60px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        .form-title { 
            text-align: center; 
            font-weight: 800; 
            font-size: 26px; 
            margin-bottom: 40px; 
            text-transform: uppercase; 
        }
        
        .row-item { 
            display: flex; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        .row-item .label-col { 
            width: 40%; 
            font-weight: 500; 
            font-size: 16px; 
            display: flex; 
            gap: 15px;
        }
        .row-item .input-col { 
            width: 60%; 
        }
        .form-control, .form-select { 
            border: none; 
            border-bottom: 1px solid #ccc; 
            border-radius: 0; 
            padding: 5px 0; 
            font-family: 'Manrope', sans-serif; 
            font-size: 16px;
        }
        .form-control:focus, .form-select:focus { 
            box-shadow: none; 
            border-bottom: 2px solid #001a72; 
            background: transparent; 
        }
        
        .btn-submit { 
            background-color: #001a72; 
            color: #fff; 
            border-radius: 30px; 
            padding: 12px 40px; 
            font-weight: 700; 
            border: none; 
            margin-top: 30px; 
            display: block; 
            margin-left: auto; 
            margin-right: auto;
        }
        
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(220, 240, 250, 0.85); 
            backdrop-filter: blur(5px); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
        }
        .modal-box { 
            background: #fff; 
            width: 450px; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); 
            position: relative; 
        }
        .modal-title { 
            text-align: center; 
            font-weight: 800; 
            color: #001a72; 
            font-size: 20px; 
            margin-bottom: 30px; 
            text-transform: uppercase; 
        }
        .close-btn { 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            font-size: 24px; 
            cursor: pointer; 
            color: #999; 
        }
        
        .input-group-custom { 
            display: flex; 
            align-items: center; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            overflow: hidden; 
            margin-bottom: 20px; 
            background: #fff;
        }
        .input-group-custom .prefix { 
            background-color: #001a72; 
            color: white; 
            padding: 8px 15px; 
            font-weight: 700; 
            font-size: 15px;
        }
        .input-group-custom input { 
            border: none; 
            padding: 8px 10px; 
            width: 100%; 
            outline: none; 
            font-size: 15px; 
            font-family: 'Manrope', sans-serif;
        }
        
        .custom-input-label { 
            font-size: 12px; 
            font-weight: 600; 
            margin-bottom: 5px; 
            color: #333; 
        }
        .btn-search { 
            background-color: #001a72; 
            color: #fff; 
            border-radius: 30px; 
            padding: 10px; 
            width: 100%; 
            font-weight: 700; 
            border: none; 
            margin-top: 10px; 
        }
        #resultContainer { 
            margin-top: 20px; 
            max-height: 200px; 
            overflow-y: auto; 
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="top-header">
    <div class="company-info">
        <img src="logo.svg" alt="An Viet Homes Logo">
        <div class="company-name">CÔNG TY CỔ PHẦN PHÁT TRIỂN DỊCH VỤ<br>VÀ ĐỊA ỐC AN VIỆT HOMES</div>
    </div>
    <button class="btn-check-status" onclick="openModal()">Kiểm tra trạng thái duyệt</button>
</div>

<div class="container">
    <div class="form-container">
        <div class="form-title">PHIẾU XÁC NHẬN CHẤM CÔNG</div>

        <form id="chamCongForm">
            <input type="hidden" name="action" value="submitForm">

            <div class="row-item">
                <div class="label-col"><span>1.</span> Họ và tên:</div>
                <div class="input-col">
                    <input type="text" class="form-control" name="hoTen" required placeholder="Nguyễn Văn A">
                </div>
            </div>

            <div class="row-item">
                <div class="label-col"><span>2.</span> Mã nhân viên:</div>
                <div class="input-col">
                    <div class="input-group-custom" style="margin-bottom: 0;">
                        <div class="prefix">AVH</div>
                        <input type="text" id="inputMaNV" required placeholder="Ví dụ: 023">
                        <input type="hidden" name="maNV" id="hiddenMaNV">
                    </div>
                </div>
            </div>

            <div class="row-item">
                <div class="label-col"><span>3.</span> Phòng ban:</div>
                <div class="input-col">
                    <select class="form-select" name="phongBan" id="phongBanSelect" required>
                        <option value="" disabled selected>Đang tải danh sách phòng...</option>
                    </select>
                </div>
            </div>

            <div class="row-item">
                <div class="label-col"><span>4.</span> Ngày:</div>
                <div class="input-col">
                    <input type="date" class="form-control" name="ngay" required>
                </div>
            </div>

            <div class="row-item">
                <div class="label-col"><span>5.</span> Giờ checkin/ checkout:</div>
                <div class="input-col">
                    <input type="text" class="form-control" name="gio" required placeholder="08:45">
                </div>
            </div>

            <div class="row-item">
                <div class="label-col"><span>6.</span> Lý do:</div>
                <div class="input-col">
                    <input type="text" class="form-control" name="lyDo" required placeholder="Gặp khách hàng...">
                </div>
            </div>

            <div class="row-item">
                <div class="label-col"><span>7.</span> Tải ảnh:</div>
                <div class="input-col">
                    <input type="file" id="fileUpload" class="form-control" accept="image/*" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Xác nhận gửi</button>
        </form>
    </div>
</div>

<!-- POPUP THÔNG BÁO -->
<div class="modal-overlay" id="customAlertModal">
    <div class="modal-box text-center" style="width: 420px; padding: 40px 30px;">
        <span class="close-btn" onclick="closeCustomAlert()">&times;</span>
        <div id="customAlertTitle" style="font-size: 20px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase;"></div>
        <div id="customAlertMessage" style="font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 25px;"></div>
        <button class="btn-submit" onclick="closeCustomAlert()" style="margin-top: 0; padding: 10px 40px; border-radius: 30px; display: inline-block;">Đã hiểu</button>
    </div>
</div>

<!-- POPUP TRA CỨU -->
<div class="modal-overlay" id="searchModal">
    <div class="modal-box">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-title">TRA CỨU LỊCH SỬ/ TRẠNG THÁI</div>
        <form id="searchForm">
            <div class="custom-input-label">Tên nhân viên</div>
            <div class="input-group-custom">
                <input type="text" id="searchName" placeholder="Nhập tên nhân viên" required>
            </div>
            <div class="custom-input-label">Mã nhân viên</div>
            <div class="input-group-custom">
                <div class="prefix">AVH</div>
                <input type="text" id="searchMaNV" placeholder="Nhập số (Ví dụ: 023)" required>
            </div>
            <button type="submit" class="btn-search" id="btnSearch">KIỂM TRA</button>
        </form>
        <div id="resultContainer"></div>
    </div>
</div>

<script>
    // ==========================================
    // DÁN LINK API WEB APP VÀO ĐÂY
    // ==========================================
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxiSMKHNSSRaJu5w_AYq07v_a-lb3eTeo0UXNJjLF8bi8KxQ5zw3h4kIzOqmZck01ty/exec';

    function checkAndOpenTracuu() {
        if (window.location.hash === '#tracuu' || window.location.search.includes('view=tracuu')) {
            setTimeout(() => { openModal(); }, 100);
        }
    }

    // TẢI DANH SÁCH PHÒNG BAN TỪ GOOGLE SHEET
    window.addEventListener('DOMContentLoaded', () => {
        const formData = new FormData();
        formData.append('action', 'getDepartments');
        
        fetch(scriptURL, { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if(data.status === "success" && data.data.length > 0) {
                const select = document.getElementById('phongBanSelect');
                select.innerHTML = '<option value="" disabled selected>Chọn phòng...</option>';
                data.data.forEach(dept => {
                    select.innerHTML += `<option value="${dept}">Phòng ${dept}</option>`;
                });
            }
        })
        .catch(err => console.log("Lỗi tải phòng ban:", err));

        checkAndOpenTracuu();
    });
    
    window.addEventListener('load', checkAndOpenTracuu);
    window.addEventListener('hashchange', checkAndOpenTracuu);

    const form = document.forms['chamCongForm'];
    const submitBtn = document.getElementById('submitBtn');

    let fileData = "";
    let fileMimeType = "";

    function showCustomAlert(title, msg, color) {
        document.getElementById('customAlertTitle').innerText = title;
        document.getElementById('customAlertTitle').style.color = color;
        document.getElementById('customAlertMessage').innerText = msg;
        document.getElementById('customAlertMessage').style.color = (color === "#c90000") ? "#c90000" : "#333";
        document.getElementById('customAlertModal').style.display = 'flex';
    }

    function closeCustomAlert() {
        document.getElementById('customAlertModal').style.display = 'none';
    }

    // XỬ LÝ ẢNH CLIENT ĐỂ NÉN GỬI GOOGLE SHEETS
    document.getElementById('fileUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) { 
            fileData = ""; fileMimeType = ""; return; 
        }
        
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800; 
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                fileMimeType = 'image/jpeg';
                fileData = dataUrl.split(',')[1];
            }
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // HÀM GỬI LÊN SHEET SAU KHI VƯỢT QUA AI
    function submitToGoogleSheets(isLate) {
        const formData = new FormData(form);
        formData.append('coHinhAnh', 'Có'); 
        formData.append('fileData', fileData);
        formData.append('fileMimeType', fileMimeType);

        fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                submitBtn.innerText = "✅ NỘP PHIẾU THÀNH CÔNG!";
                submitBtn.style.backgroundColor = "#28a745";
                submitBtn.style.color = "#fff";
                
                if(isLate) {
                    showCustomAlert("⚠ NỘP TRỄ HẠN", "Nộp phiếu thành công, nhưng do đã quá thời hạn 5 ngày theo quy định nên phiếu của bạn có thể bị HCNS trả lại hoặc không phê duyệt.", "#c90000");
                } else {
                    showCustomAlert("✅ XÁC MINH HOÀN TẤT", "Đã gửi phiếu chấm công và tải ảnh thành công!", "#28a745");
                }

                setTimeout(() => {
                    form.reset(); fileData = ""; fileMimeType = ""; 
                    document.getElementById('fileUpload').value = ""; 
                    resetButton();
                }, 2000); 
            } else {
                alert("Lỗi từ hệ thống: " + data.message); resetButton();
            }
        })
        .catch(error => { alert("Lỗi mạng! Thao tác có thể chưa được ghi nhận."); resetButton(); });
    }

    function resetButton() {
        submitBtn.disabled = false;
        submitBtn.innerText = "Xác nhận gửi";
        submitBtn.style.backgroundColor = "#001a72";
        submitBtn.style.color = "#fff";
    }

    // ==========================================
    // QUÉT KÉP: METADATA EXIF & KHOÉT RỖNG TÂM ẢNH
    // ==========================================
    form.addEventListener('submit', e => {
        e.preventDefault();
        
        if (fileData === "") {
            showCustomAlert("❌ LỖI TRỐNG ẢNH", "Vui lòng tải lên hình ảnh minh chứng bắt buộc.", "#c90000"); return;
        }
        
        const ngayInput = document.querySelector('input[name="ngay"]').value;
        const selDate = new Date(ngayInput); selDate.setHours(0,0,0,0);
        const now = new Date(); const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        const selMonths = selDate.getFullYear() * 12 + selDate.getMonth();
        const nowMonths = now.getFullYear() * 12 + now.getMonth();

        // ĐIỀU KIỆN HARD BLOCK
        if (selMonths < nowMonths && now.getDate() > 3) {
            showCustomAlert("❌ YÊU CẦU BỊ TỪ CHỐI", "Đã quá hạn nộp phiếu chấm công bổ sung.", "#c90000"); return; 
        }

        const diffTime = todayDate.getTime() - selDate.getTime();
        const isLate = Math.floor(diffTime / (1000 * 3600 * 24)) > 5;
        document.getElementById('hiddenMaNV').value = "AVH" + document.getElementById('inputMaNV').value.trim();

        submitBtn.disabled = true;
        submitBtn.style.backgroundColor = "#ffc107"; 
        submitBtn.style.color = "#000";
        
        const fileInputOCR = document.getElementById('fileUpload');
        const originalFileForOCR = fileInputOCR.files[0];
        
        submitBtn.innerText = "🔍 Đang truy xuất Metadata ảnh...";

        // LỚP 1: QUÉT METADATA
        EXIF.getData(originalFileForOCR, function() {
            const software = EXIF.getTag(this, "Software") || "";
            const make = EXIF.getTag(this, "Make") || "";
            const allExif = String(software + " " + make).toLowerCase();

            if (allExif.includes("timemark")) {
                submitBtn.innerText = "✅ Quét Metadata thành công! Đang tải lên...";
                submitToGoogleSheets(isLate);
            } else {
                
                // LỚP 2: TÁCH NỀN VÀ KHOÉT RỖNG TÂM ẢNH OCR
                submitBtn.innerText = "🔍 Đang nạp dữ liệu AI...";
                
                const readerOCR = new FileReader();
                readerOCR.onload = function(event) {
                    const imgObj = new Image();
                    imgObj.onload = function() {
                        
                        const canvasOCR = document.createElement('canvas');
                        const ctxOCR = canvasOCR.getContext('2d');
                        
                        // ĐÃ SỬA LỖI IMG.WIDTH TẠI ĐÂY -> CHUYỂN THÀNH IMGOBJ.WIDTH
                        const MAX_OCR_WIDTH = 800; 
                        const scaleOCR = Math.min(1, MAX_OCR_WIDTH / imgObj.width);
                        canvasOCR.width = imgObj.width * scaleOCR;
                        canvasOCR.height = imgObj.height * scaleOCR;
                        
                        // Vẽ toàn bộ bức ảnh lên Canvas
                        ctxOCR.drawImage(imgObj, 0, 0, canvasOCR.width, canvasOCR.height);
                        
                        // THUẬT TOÁN KHOÉT RỖNG TÂM ẢNH
                        const maskX = canvasOCR.width * 0.15;
                        const maskY = canvasOCR.height * 0.15;
                        const maskW = canvasOCR.width * 0.70;
                        const maskH = canvasOCR.height * 0.55;
                        
                        ctxOCR.fillStyle = "#ffffff";
                        ctxOCR.fillRect(maskX, maskY, maskW, maskH);
                        
                        // TÁCH NỀN (Binarization)
                        const imageData = ctxOCR.getImageData(0, 0, canvasOCR.width, canvasOCR.height);
                        const data = imageData.data;
                        
                        for (let i = 0; i < data.length; i += 4) {
                            const r = data[i]; const g = data[i+1]; const b = data[i+2];
                            
                            const isWhite = (r > 190 && g > 190 && b > 190);
                            const isYellow = (r > 170 && g > 140 && b < 130);
                            
                            if (isWhite || isYellow) {
                                data[i] = 0; data[i+1] = 0; data[i+2] = 0;
                            } else {
                                data[i] = 255; data[i+1] = 255; data[i+2] = 255;
                            }
                        }
                        ctxOCR.putImageData(imageData, 0, 0);
                        
                        const ocrBase64 = canvasOCR.toDataURL('image/jpeg', 0.9); 
                        
                        Tesseract.recognize(
                            ocrBase64,
                            'eng+vie',
                            { 
                                logger: m => { 
                                    // TÍNH NĂNG MỚI: Hiển thị chi tiết trạng thái để bạn không tưởng web bị đơ
                                    const statusMap = {
                                        'loading tesseract core': 'Tải lõi AI',
                                        'loading language traineddata': 'Tải ngôn ngữ AI',
                                        'initializing api': 'Khởi tạo API',
                                        'recognizing text': 'Đang quét ảnh'
                                    };
                                    let statusText = statusMap[m.status] || m.status;
                                    submitBtn.innerText = `🔍 ${statusText}: ${Math.round(m.progress * 100)}%`; 
                                } 
                            }
                        ).then(({ data: { text } }) => {
                            
                            const cleanText = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
                            const noSpaceText = cleanText.replace(/[^a-z0-9:]/g, ''); 
                            let score = 0;
                            
                            const vipKeywords = ['timemark', 'tinemark', 'timenark', 'diemdanh', 'chanthuc', 'camket', 'verified'];
                            if (vipKeywords.some(kw => noSpaceText.includes(kw))) score += 100;
                            
                            if (/\d{1,2}:\d{2}/.test(noSpaceText)) score += 50; 
                            const dateKeywords = ['thang', 'nam', 'thu', 'ngay', '2026', '2025'];
                            if (dateKeywords.some(kw => noSpaceText.includes(kw))) score += 50; 
                            
                            const locationKeywords = ['phuong', 'quan', 'thanhpho', 'tinh', 'quoc', 'viet'];
                            if (locationKeywords.some(kw => noSpaceText.includes(kw))) score += 50; 
                            
                            if (score >= 100) {
                                submitBtn.innerText = "✅ AI Xác minh xong! Đang tải...";
                                submitToGoogleSheets(isLate);
                            } else {
                                showCustomAlert("❌ ẢNH KHÔNG HỢP LỆ", "Ảnh tải lên không hợp lệ do đã qua chỉnh sửa hoặc không dùng đúng phần mềm chụp Timemark, vui lòng kiểm tra và thực hiện lại đúng yêu cầu.", "#c90000");
                                resetButton();
                            }
                        }).catch(err => {
                            console.error(err);
                            showCustomAlert("⚠️ LỖI QUÉT ẢNH", "Hệ thống AI gặp sự cố. Vui lòng tải lại trang và thử lại.", "#c90000");
                            resetButton();
                        });
                    };
                    imgObj.src = event.target.result;
                };
                readerOCR.readAsDataURL(originalFileForOCR);
            }
        });
    });

    // CÁC HÀM TRA CỨU
    function openModal() { document.getElementById('searchModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('searchModal').style.display = 'none'; document.getElementById('resultContainer').innerHTML = ''; document.getElementById('searchForm').reset(); }

    document.getElementById('searchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSearch'); const resContainer = document.getElementById('resultContainer');
        btn.innerText = "ĐANG TÌM..."; btn.disabled = true; resContainer.innerHTML = '<p class="text-center mt-3">Đang truy xuất dữ liệu...</p>';

        const formData = new FormData();
        formData.append('action', 'searchHistory'); formData.append('name', document.getElementById('searchName').value); formData.append('maNV', "AVH" + document.getElementById('searchMaNV').value.trim()); 

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                btn.innerText = "KIỂM TRA"; btn.disabled = false;
                if(data.status === "success" && data.data.length > 0) {
                    let html = '<ul class="list-group mt-3">';
                    data.data.forEach(item => {
                        let badgeColor = "bg-warning text-dark"; 
                        if (item.trangThai === "Đã hoàn thành") badgeColor = "bg-success";
                        else if (item.trangThai === "Từ chối" || item.trangThai === "HCNS Trả lại") badgeColor = "bg-danger";
                        
                        html += `<li class="list-group-item d-flex justify-content-between align-items-center"><div><strong>${item.ngay}</strong><br><span class="text-muted">${item.lyDo}</span></div><span class="badge ${badgeColor}">${item.trangThai}</span></li>`;
                    });
                    resContainer.innerHTML = html + '</ul>';
                } else {
                    resContainer.innerHTML = '<p class="text-center text-danger mt-3 fw-bold">Không tìm thấy dữ liệu khớp với thông tin!</p>';
                }
            }).catch(err => { btn.innerText = "KIỂM TRA"; btn.disabled = false; resContainer.innerHTML = '<p class="text-center text-danger mt-3">Lỗi kết nối!</p>'; });
    });
</script>

</body>
</html>
